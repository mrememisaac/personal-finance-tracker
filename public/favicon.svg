<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#0ea5a4"/>
  
  <!-- Wallet outline -->
  <g fill="white">
    <!-- Wallet body -->
    <rect x="28" y="40" width="72" height="52" rx="6" fill="none" stroke="white" stroke-width="3"/>
    
    <!-- Wallet flap -->
    <path d="M 28 46 Q 28 40 34 40 L 70 40 Q 76 40 76 46" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Card slot -->
    <rect x="38" y="52" width="52" height="6" fill="white" opacity="0.6"/>
    
    <!-- Coin symbol (circle) -->
    <circle cx="50" cy="75" r="8" fill="none" stroke="white" stroke-width="2"/>
    
    <!-- Currency symbol inside coin -->
    <text x="50" y="79" font-size="12" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">$</text>
    
    <!-- Rising trend line -->
    <polyline points="70,80 75,75 80,77 85,72" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>