name: CI

on:
  push:
    branches: [ main, feature/landing-page ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: pnpm/action-setup@v2
        with:
          version: '20'
      - name: Install deps
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Run tests
        run: pnpm test -- --run
      - name: Run landing page accessibility audit
        run: pnpm build && pnpm a11y:landing
